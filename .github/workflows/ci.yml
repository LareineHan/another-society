name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_URL: postgres://postgres:postgres@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: OpenAPI contract valid + generated types up to date
        run: pnpm contract:lint && pnpm contract:check
      - name: World template valid
        run: pnpm world:validate
      - name: Migrations apply cleanly to blank Postgres + acceptance tests
        run: pnpm test
      - name: Workers bundle
        run: |
          cd services/world-api && npx wrangler deploy --dry-run --outdir ../../dist/api
          npx wrangler deploy --dry-run -c wrangler.admin.toml --outdir ../../dist/admin
          cd ../jobs && npx wrangler deploy --dry-run --outdir ../../dist/jobs
